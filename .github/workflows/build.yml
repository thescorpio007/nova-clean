name: Build Nova Clean APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Optional: same signing key as your other Nova apps (keeps updates installable).
      # Without the secrets the APK is signed with a debug key (still installs fine).
      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/nova.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/nova.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Name APK and checksum
        run: |
          N=$(printf "%02d" "${{ github.run_number }}")
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/NovaClean-1.0-build-$N.apk"
          (cd out && sha256sum "NovaClean-1.0-build-$N.apk" > "NovaClean-1.0-build-$N.apk.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: NovaClean-APK
          path: out/*

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-build-${{ github.run_number }}
          name: Nova Clean 1.0 · build ${{ github.run_number }}
          files: out/*
