name: Build Nova Clean APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Bump VERSION_NAME for a new version and set BUILD_OFFSET to (current run number - 1)
  # so the displayed build number restarts at 01.
  VERSION_NAME: "2.0"
  BUILD_OFFSET: "7"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Optional: same signing key as your other Nova apps (keeps updates installable).
      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/nova.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/nova.jks" >> "$GITHUB_ENV"
          fi

      - name: Compute build number
        run: |
          BN=$(( ${{ github.run_number }} - BUILD_OFFSET ))
          echo "BUILD_NUMBER=$BN" >> "$GITHUB_ENV"
          echo "BN2=$(printf '%02d' $BN)" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Name APK and checksum
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/NovaClean-$VERSION_NAME-build-$BN2.apk"
          (cd out && sha256sum "NovaClean-$VERSION_NAME-build-$BN2.apk" > "NovaClean-$VERSION_NAME-build-$BN2.apk.sha256")

      # Updates only install over each other when every build uses the SAME key.
      - name: Require permanent signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. Add the 4 signing secrets (see README), then re-run this workflow."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: NovaClean-APK
          path: out/*

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-build-${{ env.BN2 }}
          name: Nova Clean ${{ env.VERSION_NAME }} · build ${{ env.BN2 }}
          files: out/*
